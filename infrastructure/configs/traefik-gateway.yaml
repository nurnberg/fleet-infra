---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: kube-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      # tls:
      #   mode: Terminate
      #   certificateRefs:
      #     - name: letsencrypt
      #       kind: Secret
      #       group: core
      allowedRoutes:
        namespaces:
          from: All
