apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesGateway:
        enabled: true
        experimentalChannel: true
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: true
      name: traefik-gateway
      namespacePolicy: All
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
          # tls:
          #   enabled: true
          #   options:
          #     default:
          #       minVersion: VersionTLS12
