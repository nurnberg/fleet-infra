apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: flagger
      version: "1.36.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  dependsOn:
    - name: prometheus
      namespace: monitoring
  values:
    meshProvider: "gatewayapi:v1"
    metricsServer: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
    namespace: ""
