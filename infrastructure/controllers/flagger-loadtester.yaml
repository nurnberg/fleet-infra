apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger-loadtester
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: flagger-loadtester
  template:
    metadata:
      labels:
        app: flagger-loadtester
    spec:
      containers:
        - name: loadtester
          image: ghcr.io/fluxcd/flagger-loadtester:v0.22.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: flagger-loadtester
  namespace: kube-system
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: flagger-loadtester
