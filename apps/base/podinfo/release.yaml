apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo
spec:
  interval: 2h
  releaseName: podinfo
  chart:
    spec:
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: podinfo
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    redis:
      enabled: true
      repository: public.ecr.aws/docker/library/redis
      tag: 8.6.2
    httpRoute:
      enabled: true
      parentRefs:
        - name: traefik-gateway
          namespace: kube-system
      hostnames:
        - podinfo.localhost
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
