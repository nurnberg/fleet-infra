apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: podinfo
  namespace: podinfo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  service:
    port: 9898
    gatewayRefs:
      - name: traefik-gateway
        namespace: kube-system
    hosts:
      - podinfo.staging.localhost
  analysis:
    interval: 10s
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics: []
      # - name: request-success-rate
      #   thresholdRange:
      #     min: 99
      #   interval: 1m
    webhooks:
      - name: load-test
        type: event
        url: http://flagger-loadtester.kube-system.svc.cluster.local/
        timeout: 5s
        metadata:
          type: bash
          cmd: "hey -z 30s -q 10 http://podinfo.podinfo.svc.cluster.local/"
