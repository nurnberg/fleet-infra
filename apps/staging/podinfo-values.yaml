apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo
spec:
  chart:
    spec:
      version: ">=1.0.0"
  test:
    enable: false
  values:
    replicaCount: 1
    redis:
      enabled: true
    httpRoute:
      hostnames:
        - podinfo.staging.localhost
